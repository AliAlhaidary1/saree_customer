name: saree_customer
description: تطبيق سريع ماركت للعملاء.
publish_to: "none"
version: 1.0.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  dio: ^5.8.0+1
  go_router: ^15.1.2
  shared_preferences: ^2.5.3
  cached_network_image: ^3.4.1
  intl: any
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  flutter_html: ^3.0.0
  geolocator: ^13.0.2
  path_provider: ^2.1.5
  collection: any
  google_fonts: ^6.2.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
    - assets/brand/
flutter_launcher_icons:
  android: launcher_icon
  ios: true
  image_path: assets/brand/saree-market-mark.png
  adaptive_icon_background: '#0A2540'
  adaptive_icon_foreground: assets/brand/saree-market-mark.png
  web:
    generate: true
    image_path: assets/brand/saree-market-favicon.png
    background_color: '#0A2540'
    theme_color: '#0A2540'
