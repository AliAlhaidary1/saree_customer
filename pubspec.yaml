name: sareemart_customer
description: تطبيق سريع مارت للعملاء.
publish_to: "none"
version: 1.0.3+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  dio: ^5.8.0+1
  go_router: ^15.1.2
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  cached_network_image: ^3.4.1
  intl: any
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  flutter_html: ^3.0.0
  geolocator: ^13.0.2
  path_provider: ^2.1.5
  collection: any
  google_fonts: ^6.2.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  drift: ^2.35.2
  sqlite3_flutter_libs: ^0.6.0+eol
  sqlite3: ^3.7.1
  image: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_secure_storage_platform_interface: ^1.1.2
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
    - assets/brand/
flutter_launcher_icons:
  android: launcher_icon
  ios: true
  image_path: assets/brand/sareemart-mark.png
  adaptive_icon_background: '#0A2540'
  adaptive_icon_foreground: assets/brand/sareemart-mark.png
  web:
    generate: true
    image_path: assets/brand/sareemart-favicon.png
    background_color: '#0A2540'
    theme_color: '#0A2540'
